[tool.poetry]
name = "conquest"
version = "0.1.0"
description = "Conquest — turn-based strategy game with shared pandemic mechanic. GraphQL API."
authors = ["Conquest Team"]
readme = "README.md"
packages = [{ include = "conquest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
"strawberry-graphql" = { extras = ["fastapi"], version = "^0.246" }
pydantic = ">=2.7,<2.10"  # strawberry 0.246's pydantic compat shim breaks on 2.10+
pyjwt = "^2.9"
httpx = "^0.27"
cryptography = "^43.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
hypothesis = "^6.112"
ruff = "^0.7"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
